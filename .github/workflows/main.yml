name: deploy to hosting

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-24.04-arm
    steps: 
      - name: checkout code
        uses: actions/checkout@v4.1.5
      - name: build docker image
        run: docker build -t image:latest .
      - name: save image to a file
        run: docker save image:latest -o sergheev-com-arm64.tar
      - name: set file permissions
        run: chmod 644 sergheev-com-arm64.tar
      - name: connect to tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ secrets.HOST }}
      - name: copy files to server
        uses: appleboy/scp-action@v0.1.7
        with: 
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "sergheev-com-arm64.tar"
          target: "~/docker/"
      - name: deploy container to server
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
              sudo docker load -i ~/docker/sergheev-com-arm64.tar
              sudo docker tag sergheev-com-arm64:latest sergheev-com-arm64:previous
              sudo docker tag image sergheev-com-arm64:latest
              sudo docker stop vapor || true
              sudo docker rm vapor || true
              sudo docker run --restart unless-stopped -d --name vapor -p 8080:8080 -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} sergheev-com-arm64:latest
              sudo docker system prune -f